Listen 8081
Listen 8082

# Por nombre (puerto 80 interno → 8080 del host)
<VirtualHost *:80>
    ServerName site1.local
    DocumentRoot /var/www/site1
</VirtualHost>
<VirtualHost *:80>
    ServerName site2.local
    DocumentRoot /var/www/site2
</VirtualHost>

# Por puerto
<VirtualHost *:8081>
    DocumentRoot /var/www/site1
</VirtualHost>
<VirtualHost *:8082>
    DocumentRoot /var/www/site2
</VirtualHost>