services:
  web-apache:
    build: ./apache
    container_name: web-apache
    ports: ["8080:80", "8081:8081", "8082:8082"]
    volumes:
      - ./websites/site1:/var/www/site1
      - ./websites/site2:/var/www/site2
    networks: [hosting-net]

  web-nginx:
    image: nginx:alpine
    container_name: web-nginx
    ports: ["8090:80", "8083:8083", "8084:8084"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./websites/site1:/usr/share/nginx/html/site1
      - ./websites/site2:/usr/share/nginx/html/site2
    networks: [hosting-net]

networks:
  hosting-net:
    driver: bridge