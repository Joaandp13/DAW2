<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practica Sistemes i Marcs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .controles {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="text"] {
      padding: 8px;
      width: 300px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    #div {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      background-color: #f9f9f9;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 2px solid #333;
    }
  </style>
</head>
<body>

  <h1>Informació del Sistema i Prova de Marcs</h1>

  <!-- Secció del Div principal -->
  <h2>Informació en el DIV</h2>
  <div id="div">El contingut de la informació del sistema es carregarà aquí...</div>

  <!-- Controles para el iframe -->
  <h2>Control del Marc (&lt;iframe&gt;)</h2>
  <div class="controles">
    <label for="urlInput">URL:</label>
    <input type="text" id="urlInput" placeholder="Escriu una URL (p. ex. http://www.sapalomera.cat)">
    <button id="btnMarc">Marc</button>
  </div>

  <!-- El iframe donde se mostrará el contenido -->
  <iframe id="meuFrame" title="Marc de proves"></iframe>

  <!-- Incluimos el script compilado de TypeScript (dist/app.js) -->
  <script src="app.js" type="module"></script>
</body>
</html>
