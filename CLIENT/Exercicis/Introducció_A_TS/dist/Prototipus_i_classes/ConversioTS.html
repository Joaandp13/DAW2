<!DOCTYPE html>
<html lang="ca">
<head>

<body>
<nav><a href="../index.html">← Índex</a></nav>
<h1>Prototipus i classes · 1 Convertir a TypeScript</h1>
<section>
<h3>1 - Funció PVP</h3>
<p>Funció amb propietats (caché).</p>
<button id="btn-ex1a">Executar</button>
<pre id="out-ex1a"></pre>
</section>
<section>
<h3>1 - Filtres</h3>
<p>Funcions que retornen funcions (clausures).</p>
<button id="btn-f-bijuteria">Bijuteria</button><pre id="out-f-bijuteria"></pre>
<button id="btn-f-obrellaunes">Obrellaunes</button><pre id="out-f-obrellaunes"></pre>
<button id="btn-f-bany">Bany</button><pre id="out-f-bany"></pre>
<button id="btn-f-neteja">Neteja</button><pre id="out-f-neteja"></pre>
<button id="btn-f-cap">Cerca sense resultat</button><pre id="out-f-cap"></pre>
</section>
<section>
<h3>1 - Monitor</h3>
Temperatura <input id="temperatura" type="number" step="0.1" value="36.5" style="width:5rem">
Pulsacions <input id="pulsacions" type="number" value="72" style="width:5rem">
Oxigen <input id="oxigen" type="number" value="97" style="width:5rem">
<input id="aturada" type="checkbox"><label for="aturada"> Aturada</label><br>
<button id="btn-escanejar">Escanejar</button>
<pre id="out-monitor"></pre>
</section>

<script type="module" src="ConversioTS.js"></script>
